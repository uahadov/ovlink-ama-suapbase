<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="BF6x9uZr0jfhr5yHSCErdYzlCN+Z88eyTY180=">
  <title data-i18n="login_title">Giriş Yap - URL Kısaltma</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Özel CSS -->
  <link rel="stylesheet" href="style.css" />
  <meta name="description"
    content="Ovlink giriş yapın. Linklerinizi yönetin, istatistikleri inceleyin ve daha fazlasına erişin." />
</head>

<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo-box">
      <a href="/"><img src="logo.webp" alt="Ovlink Logo"></a>
    </div>

    <h1 class="auth-title" data-i18n="login_title">Xoş Gəldiniz</h1>
    <p class="auth-subtitle" data-i18n="login_subtitle">Hesabınıza daxil olun</p>

    <form id="loginForm">
      <div class="mb-3 auth-field">
        <label for="email" class="form-label" data-i18n="login_email">E-posta Adresi</label>
        <div class="input-group auth-input">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control" id="email" required placeholder="numune@email.com"
            data-i18n="login_email_placeholder">
        </div>
      </div>

      <div class="mb-3 auth-field">
        <label for="password" class="form-label" data-i18n="login_pass">Şifre</label>
        <div class="input-group auth-input">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" required placeholder="******">
        </div>
      </div>

      <button type="submit" class="btn btn-primary auth-btn">
        <span data-i18n="login_btn">Giriş</span> <i class="fa-solid fa-arrow-right ms-2"></i>
      </button>
    </form>

    <p id="loginMessage" class="text-center text-danger small mt-3 mb-0"></p>

    <p class="auth-links mb-0">
      <span data-i18n="no_account">Hesabınız yok mu?</span>
      <a href="/register.html" data-i18n="register_link">Qeydiyyatdan keçin</a>
    </p>

    <a href="/" class="auth-home" aria-label="Ana Sayfa">
      <i class="fa-solid fa-house"></i> <span data-i18n="nav_home">Ana Səhifə</span>
    </a>

    <button id="langToggleBtn" class="auth-lang" aria-label="Dil Değiştir">TR</button>
  </div>

  <script nonce="B4vnCAfrJpk1NhI4Bffl+g=="
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script nonce="B4vnCAfrJpk1NhI4Bffl+g==" src="lang.js"></script>
  <script nonce="B4vnCAfrJpk1NhI4Bffl+g==" src="script.js"></script>
  <script nonce="B4vnCAfrJpk1NhI4Bffl+g==">
    // Login Logic
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMessage');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': getCsrfToken()
          },
          credentials: 'include',
          body: JSON.stringify({ email, password, _csrf: getCsrfToken() })
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "text-center text-success small";
          msg.textContent = currentLang === 'az' ? "Giriş uğurludur! Yönləndirilirsiniz..." : "Giriş başarılı! Yönlendiriliyorsunuz...";
          setClientSession({ email: data.username, isAdmin: false });
          setTimeout(() => window.location.href = '/', 1000);
        } else {
          msg.className = "text-center text-danger small";
          msg.textContent = data.error;
        }
      } catch (err) {
        msg.textContent = currentLang === 'az' ? "Xəta baş verdi." : "Hata oluştu.";
      }
    });
  </script>
</body>

</html>
