name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ovlink
          POSTGRES_PASSWORD: ovlink
          POSTGRES_DB: ovlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ovlink:ovlink@localhost:5432/ovlink_test
      SESSION_SECRET: ci_session_secret_that_is_definitely_longer_than_64_bytes_for_testing_only_0123456789abcdef
      # Fixed CI-only key (64 hex chars); never used outside GitHub Actions.
      ENCRYPTION_KEY: 4f9a1c2b8e7d6053a1f0c9b82d7e4156a3c8f0d2b6e4917c5a0d3f8e2b4c6a9d
      NODE_ENV: test
      PORT: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene (no prospect data)
        run: |
          if git ls-files | grep -Eq '(^|/)(ovlink_)?.*leads.*\.(csv|html)$'; then
            echo 'Prospect/lead exports must not be tracked in the repository.'
            git ls-files | grep -E '(^|/)(ovlink_)?.*leads.*\.(csv|html)$'
            exit 1
          fi

      - name: Syntax check (whole repository)
        run: npm run check:syntax:all

      - name: Run test suite
        run: npm test

      - name: Coverage report (non-blocking)
        continue-on-error: true
        run: npm run test:coverage

      - name: Dependency audit (critical)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical
