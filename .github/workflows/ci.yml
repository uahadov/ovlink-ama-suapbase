name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ovlink
          POSTGRES_PASSWORD: ovlink
          POSTGRES_DB: ovlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ovlink:ovlink@localhost:5432/ovlink_test
      SESSION_SECRET: ci_session_secret_that_is_definitely_longer_than_64_bytes_for_testing_only_0123456789abcdef
      # Fixed CI-only key (64 hex chars); never used outside GitHub Actions.
      ENCRYPTION_KEY: 4f9a1c2b8e7d6053a1f0c9b82d7e4156a3c8f0d2b6e4917c5a0d3f8e2b4c6a9d
      NODE_ENV: test
      PORT: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js routes/admin.js public/script.js public/lang.js public/home.js public/sw.js bots/telegram.js bots/discord.js bots/shared.js utils/polar.js utils/crypto.js

      - name: Run test suite
        run: npm test

      - name: Dependency audit (critical)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical
